name: Security

# Supply-chain and code scanning, beside CI rather than inside it: CI answers
# "does it work", this answers "is it safe to run", and the second question has
# to be asked again every week even when nothing here changed, because the
# vulnerability databases did.
#
# Like CI, this checks out moqom-go beside this repository for the replace
# directive in go.mod; see ci.yml for what that needs while moqom-go is private.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "35 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moqom-mcp

      - uses: actions/checkout@v4
        with:
          repository: moqom-cloud/moqom-go
          path: moqom-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: moqom-mcp/go.mod
          cache-dependency-path: moqom-mcp/go.sum

      # Fails only on vulnerabilities in code this server actually calls.
      - name: Reachable vulnerabilities
        working-directory: moqom-mcp
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gitleaks:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The binary rather than gitleaks-action, which needs a paid licence for
      # organisation repositories. Whole history: a secret removed in a later
      # commit is still published.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: moqom-mcp

      - uses: actions/checkout@v4
        with:
          repository: moqom-cloud/moqom-go
          path: moqom-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: moqom-mcp/go.mod
          cache-dependency-path: moqom-mcp/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
          source-root: moqom-mcp

      - name: Build
        working-directory: moqom-mcp
        run: go build ./...

      - uses: github/codeql-action/analyze@v4

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard publishes to the public API, and only for public repositories.
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
